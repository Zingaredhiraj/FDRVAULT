services:
  - type: web
    name: aicte-fdr-vault-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: pnpm install && npx prisma generate && npx prisma db push --accept-data-loss && npx tsx prisma/seed.ts --clean && pnpm run build
    startCommand: npx prisma db push --accept-data-loss && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
